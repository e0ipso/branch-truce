name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # The PR's commits, or the pushed ones. After a force push the old tip is
      # gone, so only the last commit is linted.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

      - run: npm run typecheck
      - run: npm run check:tracker-refs
      - run: npm test
      - run: /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /bin/bash tools/check-shell-syntax.sh

      - name: Core and sanitizer CTest
        run: |
          ./tools/prepare-worktree.sh core
          cmake --build build/core --parallel 2
          ctest --test-dir build/core --output-on-failure -V
          ./tools/prepare-worktree.sh sanitize
          cmake --build build/sanitize --parallel 2
          ctest --test-dir build/sanitize --output-on-failure -V

  # Branch Truce on each supported KDE desktop target (Kubuntu 26.04 and Tuxedo
  # OS 24.04 noble), in the pinned images of packaging/ci: CTest (including
  # qmllint and install.prefix), then the DEB with installation, smoke-test
  # loading, upgrade and removal checks. The version is the one in package.json;
  # the kde-release jobs build the release packages.
  kde:
    name: kde (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Kubuntu 26.04
            format: kubuntu-deb
          - target: Tuxedo OS 24.04
            format: tuxedo-deb
    env:
      FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Identify the dependency images
        id: images
        run: |
          refresh="$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%G-W%V)"
          echo "BRANCH_TRUCE_KDE_CI_REFRESH=$refresh" >> "$GITHUB_ENV"
          echo "id=$(BRANCH_TRUCE_KDE_CI_REFRESH="$refresh" packaging/ci/image-id.sh --format "$FORMAT")" >> "$GITHUB_OUTPUT"
      - id: restore-images
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}
      - name: Test, package and check
        env:
          OUTPUT: ${{ runner.temp }}/kde
          BRANCH_TRUCE_KDE_CI_IMAGE_CACHE: ${{ runner.temp }}/kde-images
        run: |
          version="$(node -p 'require("./package.json").version')"
          packaging/scripts/container-check.sh --version "$version" --format "$FORMAT" --output "$OUTPUT"
      - if: steps.restore-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}

  # The release runs in three stages once every check has passed. This job
  # works out the version the pushed commits release with a semantic-release
  # dry run (packaging/ci/next-release.js), or nothing when they warrant no
  # release, and records the commit it was worked out for.
  release-version:
    needs: [test, kde]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Work out the next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node packaging/ci/next-release.js)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The branch-truce Kubuntu 26.04 and Tuxedo OS 24.04 DEBs for that version and
  # commit, each on its own runner, tested, built and checked by
  # packaging/scripts/container-check.sh as in the kde job. Each leg uploads its
  # package with a manifest (format, version, revision, package, SHA-256) as
  # kde-release-<format>.
  kde-release:
    name: kde-release (${{ matrix.target }})
    needs: release-version
    if: needs.release-version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Kubuntu 26.04
            format: kubuntu-deb
          - target: Tuxedo OS 24.04
            format: tuxedo-deb
    env:
      FORMAT: ${{ matrix.format }}
      VERSION: ${{ needs.release-version.outputs.version }}
      REVISION: ${{ needs.release-version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-version.outputs.revision }}
          persist-credentials: false
      - name: Identify the dependency images
        id: images
        run: |
          refresh="$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%G-W%V)"
          echo "BRANCH_TRUCE_KDE_CI_REFRESH=$refresh" >> "$GITHUB_ENV"
          echo "id=$(BRANCH_TRUCE_KDE_CI_REFRESH="$refresh" packaging/ci/image-id.sh --format "$FORMAT")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}
      - name: Fetch the previous package
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ runner.temp }}/previous
        run: |
          file="$(packaging/ci/previous-package.sh --format "$FORMAT" --version "$VERSION" --output "$DIR")"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Test, package and check
        env:
          OUTPUT: ${{ runner.temp }}/kde
          BRANCH_TRUCE_KDE_CI_IMAGE_CACHE: ${{ runner.temp }}/kde-images
          PREVIOUS: ${{ steps.previous.outputs.file }}
        run: |
          previous=()
          [ -z "$PREVIOUS" ] || previous=(--previous-package "$PREVIOUS")
          packaging/scripts/container-check.sh --version "$VERSION" --format "$FORMAT" --output "$OUTPUT" "${previous[@]}"
      - name: Record the package
        env:
          OUTPUT: ${{ runner.temp }}/kde
          DIR: ${{ runner.temp }}/kde-release
        run: |
          if [ "$(git rev-parse HEAD)" != "$REVISION" ]; then
            echo "::error::checked out $(git rev-parse HEAD), expected $REVISION"
            exit 1
          fi
          native="$(packaging/scripts/native-version.sh "$VERSION")"
          shopt -s nullglob
          if [ "$FORMAT" = kubuntu-deb ]; then
            packages=("$OUTPUT/branch-truce_${native}_amd64-ubuntu26.04.deb")
          else
            packages=("$OUTPUT/branch-truce_${native}_amd64-tuxedo24.04.deb")
          fi
          if [ "${#packages[@]}" != 1 ] || [ ! -f "${packages[0]}" ]; then
            echo "::error::expected one branch-truce $FORMAT for $native in $OUTPUT"
            ls -l "$OUTPUT"
            exit 1
          fi
          mkdir -p "$DIR"
          cp "${packages[0]}" "$DIR/"
          name="$(basename "${packages[0]}")"
          jq -n --arg format "$FORMAT" --arg version "$VERSION" --arg revision "$REVISION" \
            --arg package "$name" --arg sha256 "$(sha256sum "$DIR/$name" | cut -d' ' -f1)" \
            '{format: $format, version: $version, revision: $revision, package: $package, sha256: $sha256}' \
            > "$DIR/kde-$FORMAT.json"
          cat "$DIR/kde-$FORMAT.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kde-release-${{ matrix.format }}
          path: ${{ runner.temp }}/kde-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The final gate: it runs only when both kde-release legs passed, with their
  # packages in dist/kde, on the same commit (github.sha). The plugin checks
  # each manifest against that commit before semantic-release commits or tags.
  release:
    needs: [test, kde, release-version, kde-release]
    if: github.event_name == 'push' && needs.release-version.outputs.version != ''
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kde-release-*
          merge-multiple: true
          path: dist/kde

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_TRUCE_KDE_RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
        run: npx --no -- semantic-release

      - id: tag
        run: echo "tag=$(git tag --points-at HEAD 'v*')" >> "$GITHUB_OUTPUT"

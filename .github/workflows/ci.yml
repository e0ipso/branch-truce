name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

# PRs cancel only earlier runs for the same PR. Main runs have unique groups;
# their publishing jobs retain the separate serialized release boundary.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # The PR's commits, or the pushed ones. After a force push the old tip is
      # gone, so only the last commit is linted.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

      - run: npm run typecheck
      - run: npm run check:tracker-refs
      - run: npm test
      - run: /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /bin/bash tools/check-shell-syntax.sh

      - name: Core and sanitizer CTest
        run: |
          ./tools/prepare-worktree.sh core
          cmake --build build/core --parallel 2
          ctest --test-dir build/core --output-on-failure -V
          ./tools/prepare-worktree.sh sanitize
          cmake --build build/sanitize --parallel 2
          ctest --test-dir build/sanitize --output-on-failure -V

  # Only main analysis receives write access for semantic-release's push
  # preflight. A failed analysis fails selection, never becoming no-release.
  analyze-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Analyze the main release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bt_release_version="$(node packaging/ci/next-release.js --analyze)"
          echo "version=$bt_release_version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # !cancelled() explicitly allows the skipped main analyzer on PRs. No
  # release-write token or semantic-release invocation reaches this job.
  select:
    needs: analyze-release
    if: "!cancelled() && (needs.analyze-release.result == 'success' || (github.event_name == 'pull_request' && needs.analyze-release.result == 'skipped'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      revision: ${{ steps.candidate.outputs.revision }}
      publish: ${{ steps.candidate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: candidate
        env:
          BRANCH_TRUCE_CI_EVENT: ${{ github.event_name }}
          BRANCH_TRUCE_ANALYZED_VERSION: ${{ needs.analyze-release.outputs.version }}
          BRANCH_TRUCE_ANALYZED_REVISION: ${{ needs.analyze-release.outputs.revision }}
        run: |
          bt_release_selection="$(node packaging/ci/next-release.js)"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$bt_release_selection" >> "$GITHUB_OUTPUT"

  # One full desktop/CTest/install-prefix/native package lifecycle per target
  # at the selected candidate and revision, including PR and no-release paths.
  # ui.qmllint remains the single warning-free lint invocation in CTest.
  kde:
    name: kde (${{ matrix.target }})
    needs: select
    if: "!cancelled() && needs.select.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Kubuntu 26.04
            format: kubuntu-deb
          - target: Fedora 44
            format: fedora-rpm
          - target: Arch Linux
            format: arch-pkg
    env:
      FORMAT: ${{ matrix.format }}
      VERSION: ${{ needs.select.outputs.version }}
      REVISION: ${{ needs.select.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false
      - name: Identify the dependency images
        id: images
        run: |
          bt_release_refresh="$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%G-W%V)"
          echo "BRANCH_TRUCE_KDE_CI_REFRESH=$bt_release_refresh" >> "$GITHUB_ENV"
          echo "id=$(BRANCH_TRUCE_KDE_CI_REFRESH="$bt_release_refresh" packaging/ci/image-id.sh --format "$FORMAT")" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - id: restore-images
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}
      # GitHub scopes PR saves to their merge ref. The compatible prefix spans
      # source revisions; each successful run saves a fresh immutable entry.
      - id: restore-compiler
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/compiler-cache
          key: compiler-v1-${{ matrix.format }}-${{ steps.images.outputs.arch }}-${{ steps.images.outputs.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-v1-${{ matrix.format }}-${{ steps.images.outputs.arch }}-${{ steps.images.outputs.id }}-
      - name: Fetch the previous package
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIR: ${{ runner.temp }}/previous
        run: |
          bt_release_previous="$(packaging/ci/previous-package.sh --format "$FORMAT" --version "$VERSION" --output "$DIR")"
          echo "file=$bt_release_previous" >> "$GITHUB_OUTPUT"
      - name: Test, package and check
        id: build
        env:
          OUTPUT: ${{ runner.temp }}/kde
          BRANCH_TRUCE_COMPILER_CACHE: ${{ runner.temp }}/compiler-cache
          BRANCH_TRUCE_KDE_CI_IMAGE_CACHE: ${{ runner.temp }}/kde-images
          PREVIOUS: ${{ steps.previous.outputs.file }}
          BRANCH_TRUCE_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_TRUCE_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          BRANCH_TRUCE_CI_JOB: ${{ github.job }}
          BRANCH_TRUCE_CI_SOURCE_REVISION: ${{ needs.select.outputs.revision }}
        run: |
          bt_release_previous_args=()
          [ -z "$PREVIOUS" ] || bt_release_previous_args=(--previous-package "$PREVIOUS")
          packaging/scripts/container-check.sh --version "$VERSION" --format "$FORMAT" --output "$OUTPUT" "${bt_release_previous_args[@]}"
      - name: Record validation provenance
        if: always()
        env:
          OUTPUT: ${{ runner.temp }}/kde
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          IMAGE_INPUTS: ${{ steps.images.outputs.id }}
        run: |
          mkdir -p "$OUTPUT"
          jq -n --arg run "$RUN_URL" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg revision "$REVISION" --arg observed "$(git rev-parse HEAD)" \
            --arg format "$FORMAT" --arg job "$GITHUB_JOB" --arg outcome "$BUILD_OUTCOME" \
            --arg images "$IMAGE_INPUTS" --arg date "$(date -u +%FT%TZ)" \
            '{run: $run, attempt: $attempt, selected_revision: $revision, source_head_observed: $observed,
              format: $format, job: $job, build_outcome: $outcome, image_inputs: $images, collected_at_utc: $date,
              acceptance: "pending independent original capture and per-callout inspection",
              installed_ui_validation: "pending; native package lifecycle logs are separate from installed UI observations",
              physical_desktop: false}' > "$OUTPUT/ci-provenance.json"
          find "$OUTPUT" -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
            -exec sha256sum {} + > "$OUTPUT/package-sha256.txt"
      - name: Save compiler cache
        if: success() && steps.build.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/compiler-cache
          key: compiler-v1-${{ matrix.format }}-${{ steps.images.outputs.arch }}-${{ steps.images.outputs.id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.restore-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/kde-images/${{ matrix.format }}-${{ steps.images.outputs.id }}.tar
          key: kde-images-${{ matrix.format }}-${{ steps.images.outputs.id }}
      - name: Record the package
        if: needs.select.outputs.publish == 'true'
        env:
          OUTPUT: ${{ runner.temp }}/kde
          DIR: ${{ runner.temp }}/kde-release
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$REVISION" ]; then
            echo "::error::checked out $(git rev-parse HEAD), expected $REVISION"
            exit 1
          fi
          bt_release_info="$(packaging/scripts/package-info.sh --format "$FORMAT" --version "$VERSION")"
          bt_release_name="$(jq -r .filename <<< "$bt_release_info")"
          test -f "$OUTPUT/$bt_release_name"
          mkdir -p "$DIR"
          cp "$OUTPUT/$bt_release_name" "$DIR/"
          jq --arg revision "$REVISION" --arg runId "$RUN_ID" \
            --arg sha256 "$(sha256sum "$DIR/$bt_release_name" | cut -d' ' -f1)" \
            '. + {revision: $revision, runId: $runId, package: .filename, sha256: $sha256} | del(.filename)' \
            <<< "$bt_release_info" > "$DIR/kde-$FORMAT.json"
          cat "$DIR/kde-$FORMAT.json"
      - if: needs.select.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kde-release-${{ matrix.format }}
          path: ${{ runner.temp }}/kde-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Preserve native validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kde-evidence-${{ matrix.format }}
          path: |
            ${{ runner.temp }}/kde/tests/
            ${{ runner.temp }}/kde/containers/
            ${{ runner.temp }}/kde/cache/
            ${{ runner.temp }}/kde/ci-provenance.json
            ${{ runner.temp }}/kde/package-sha256.txt
            !${{ runner.temp }}/kde/tests/**/driver-build/**
          if-no-files-found: warn
          retention-days: 7

  # Every validation result is required. Only this run's three candidate
  # artifacts are downloaded, and the plugin checks identity and digest before
  # any release metadata, tags or assets can be written.
  release:
    needs: [test, select, kde]
    if: github.event_name == 'push' && needs.select.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install native metadata readers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm libarchive-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kde-release-*
          merge-multiple: true
          path: dist/kde
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_TRUCE_KDE_RELEASE_VERSION: ${{ needs.select.outputs.version }}
          BRANCH_TRUCE_KDE_RELEASE_REVISION: ${{ needs.select.outputs.revision }}
          BRANCH_TRUCE_KDE_RELEASE_RUN_ID: ${{ github.run_id }}
        run: npx --no -- semantic-release
      - id: tag
        run: echo "tag=$(git tag --points-at HEAD 'v*')" >> "$GITHUB_OUTPUT"
